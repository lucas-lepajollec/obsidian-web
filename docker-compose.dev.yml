name: shardnote-dev

services:
  shardnote-dev:
    build:
      context: .
      target: development
    container_name: shardnote-dev
    init: true
    ports:
      - "${SHARDNOTE_DEV_BIND_ADDRESS:-127.0.0.1}:2499:2499"
    volumes:
      - .:/app
      - /app/node_modules
      - ${SHARDNOTE_VAULT_PATH:-./vault}:/vault:rw
    environment:
      NOTES_PATH: /vault
      SHARDNOTE_PASSWORD: ${SHARDNOTE_PASSWORD:?Set SHARDNOTE_PASSWORD in your environment or .env file}
      SHARDNOTE_SESSION_SECRET: ${SHARDNOTE_SESSION_SECRET:?Set SHARDNOTE_SESSION_SECRET in your environment or .env file}
      SHARDNOTE_PUBLIC_READ: ${SHARDNOTE_PUBLIC_READ:-false}
      SHARDNOTE_SECURE_COOKIES: "false"
