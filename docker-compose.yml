name: shardnote

services:
  shardnote:
    image: ${SHARDNOTE_IMAGE:-ghcr.io/lucas-lepajollec/shardnote:latest}
    container_name: shardnote
    restart: unless-stopped
    init: true
    ports:
      - "2506:2506"
    volumes:
      - ${SHARDNOTE_VAULT_PATH:-./vault}:/vault:rw
    environment:
      NOTES_PATH: /vault
      SHARDNOTE_PASSWORD: ${SHARDNOTE_PASSWORD:?Set SHARDNOTE_PASSWORD in your environment or .env file}
      SHARDNOTE_SESSION_SECRET: ${SHARDNOTE_SESSION_SECRET:?Set SHARDNOTE_SESSION_SECRET in your environment or .env file}
      SHARDNOTE_PUBLIC_READ: ${SHARDNOTE_PUBLIC_READ:-false}
      SHARDNOTE_SECURE_COOKIES: ${SHARDNOTE_SECURE_COOKIES:-false}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0750
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2506/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
